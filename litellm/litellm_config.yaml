# LiteLLM proxy for dbt-factory. Claude Code / Agent SDK call the Anthropic Messages API
# (/v1/messages); LiteLLM translates that to any provider listed here.
model_list:
  - model_name: gpt-4o                      # FACTORY_MODEL=gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4o-mini                 # used for Claude Code's "small/fast" background calls
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  # Any OpenAI-compatible server (vLLM, Ollama, Together, Groq, Azure...):
  # - model_name: local-qwen
  #   litellm_params:
  #     model: openai/Qwen2.5-Coder-32B-Instruct
  #     api_base: http://localhost:8000/v1
  #     api_key: os.environ/LOCAL_LLM_KEY
  # Real Claude through the same gateway (for spend tracking):
  # - model_name: claude-sonnet
  #   litellm_params: { model: anthropic/claude-sonnet-4-5, api_key: os.environ/ANTHROPIC_UPSTREAM_KEY }

litellm_settings:
  drop_params: true          # ignore Anthropic-only params the upstream doesn't support
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # clients send this as ANTHROPIC_AUTH_TOKEN
