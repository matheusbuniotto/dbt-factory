name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  PYTHON_DEFAULT: '3.12'
  NODE_VERSION: '22'
  ACTIONLINT_VERSION: '1.7.12'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  # ─────────────────────────────── routing ───────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'evals/**'
              - 'examples/**'
              - 'scripts/**'
              - 'requirements*.txt'
              - 'pyproject.toml'
            frontend:
              - 'frontend/**'
            docs:
              - '**/*.md'
              - 'docs/**'
            ci:
              - '.github/**'
              - '.ci/**'
              - '.pre-commit-config.yaml'
              - 'Dockerfile'
              - '.dockerignore'

  # ─────────────────────────── stage 1: hygiene ──────────────────────────
  hygiene:
    name: Hygiene (pre-commit · actionlint · commitlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (ruff, prettier, markdownlint, shellcheck, editorconfig, yaml/json)
        run: |
          pip install pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure
      - name: actionlint
        run: |
          bash scripts/ci/install_tool.sh actionlint "$ACTIONLINT_VERSION"
          ./bin/actionlint -color
      - name: commitlint (PR commits follow Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx --yes -p @commitlint/cli@20 -p @commitlint/config-conventional@20 commitlint --from "$BASE" --to "$HEAD" --verbose

  # ─────────────────────────── stage 2: static ───────────────────────────
  static:
    name: Static analysis (mypy · tsc · eslint)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: mypy (ratchet against .ci/mypy-baseline.txt)
        run: bash scripts/ci/mypy_ratchet.sh
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc -b --noEmit
      - name: ESLint (warning budget)
        working-directory: frontend
        run: npx eslint . --max-warnings 70

  complexity:
    name: Complexity (radon · xenon · lizard · jscpd)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install analyzers
        run: |
          uv venv .venv --python "$PYTHON_DEFAULT"
          uv pip install --python .venv/bin/python radon==6.0.1 xenon==0.9.3 lizard==1.24.1
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Complexity ratchet (CC ≤ 15, MI ≥ 10, file ≤ 600 lines, function ≤ 120 lines)
        run: python scripts/ci/complexity_gate.py --report complexity-report.md
      - name: xenon (average rank ≤ B)
        run: xenon --max-average B --max-modules F --max-absolute F backend evals scripts
      - name: jscpd (duplication ≤ 3%)
        run: npx --yes jscpd@4 --threshold 3 --reporters consoleFull,markdown --output jscpd-report --gitignore --ignore "**/node_modules/**,**/dist/**,projects/**,worktrees/**,evals/results/**,examples/sql/**" backend evals scripts frontend/src
      - name: Publish report
        if: always()
        run: |
          if [ -f complexity-report.md ]; then cat complexity-report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f jscpd-report/jscpd-report.md ]; then
            { echo; echo "## Duplication (jscpd)"; cat jscpd-report/jscpd-report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: complexity-report
          path: |
            complexity-report.md
            jscpd-report/
          if-no-files-found: ignore

  # ───────────────────────────── security ────────────────────────────────
  security:
    name: Security
    needs: changes
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_security.yml

  # ─────────────────────────────── tests ─────────────────────────────────
  test:
    name: Tests (py${{ matrix.python }})
    needs: [changes, hygiene]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity (worktrees commit)
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: scripts/setup.sh (demo jaffle_shop project + prod warehouse)
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          SKIP_FRONTEND: '1'
        run: ./scripts/setup.sh
      - name: pytest + coverage
        run: |
          pytest -q --cov --cov-report=xml --cov-report=term-missing:skip-covered \
            --cov-fail-under="$(cat .ci/coverage-threshold)" --junitxml=junit-${{ matrix.python }}.xml
      - name: diff-cover (changed lines ≥ 80%)
        if: github.event_name == 'pull_request' && matrix.python == '3.12'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          # Bulk PRs (mass reformat/refactor touching > 500 Python lines) are covered by the global gate;
          # for those diff-cover still reports but does not block. Normal PRs need >= 80% on changed lines.
          changed=$(git diff --numstat "origin/$BASE_REF...HEAD" -- '*.py' | awk '{s+=$1} END {print s+0}')
          fail_under=80
          if [ "$changed" -gt 500 ]; then
            fail_under=0
            echo "::warning title=diff-cover advisory::$changed changed Python lines (> 500): reporting only"
          fi
          diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under="$fail_under" --markdown-report diff-cover.md
      - name: Test summary
        if: always()
        env:
          PY: ${{ matrix.python }}
        run: python scripts/ci/test_summary.py "junit-$PY.xml" coverage.xml diff-cover.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: |
            junit-*.xml
            coverage.xml
            diff-cover.md
          if-no-files-found: ignore

  # ─────────────────────────────── data ──────────────────────────────────
  data:
    name: Data (dbt · sqlfluff · evals)
    needs: [changes, hygiene]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          dev: 'false'
      - name: Configure git identity (worktrees commit)
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: scripts/setup.sh
        env:
          SKIP_FRONTEND: '1'
        run: ./scripts/setup.sh
      - name: dbt parse / compile (demo project)
        working-directory: projects/jaffle_shop
        env:
          DBT_PROFILES_DIR: .
        run: dbt parse && dbt compile --quiet
      - name: sqlfluff (reference SQL, gating)
        run: sqlfluff lint examples/sql --config examples/sql/.sqlfluff
      - name: Start API (mock engine)
        env:
          FACTORY_MOCK: '1'
          FACTORY_MOCK_DELAY: '0'
        run: |
          (cd backend && nohup uvicorn main:app --host 127.0.0.1 --port 8787 > ../backend.log 2>&1 &)
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8787/api/health && exit 0; sleep 1; done
          cat backend.log; exit 1
      - name: Evals (mock) + expected-outcome gate
        env:
          FACTORY_MOCK_DELAY: '0'
        run: |
          python -m evals run --engine mock --parallel 1 --run-id ci-mock --label "CI ${{ github.sha }}"
          python scripts/ci/eval_gate.py evals/results/ci-mock.json --out eval-scorecard.md
      - name: Scorecard → job summary
        if: always()
        run: |
          if [ -f eval-scorecard.md ]; then cat eval-scorecard.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: |
            evals/results/ci-mock.json
            eval-scorecard.md
            backend.log
          if-no-files-found: ignore

  # ───────────────────────────── frontend ────────────────────────────────
  frontend:
    name: Frontend (build · bundle budget · Lighthouse)
    needs: [changes, static]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: vite build
        working-directory: frontend
        run: npm run build
      - name: Bundle-size budget
        run: python3 scripts/ci/bundle_budget.py frontend/dist | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Lighthouse CI (preview build, advisory)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  # ───────────────────────────── container ───────────────────────────────
  container:
    name: Container (hadolint · buildx)
    needs: [changes, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build (no push, gha cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: dbt-factory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (non-root, healthy)
        run: |
          test "$(docker run --rm --entrypoint id dbt-factory:ci -u)" = "10001"
          cid=$(docker run -d -p 8787:8787 dbt-factory:ci)
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/api/health || { docker logs "$cid"; exit 1; }
          docker rm -f "$cid"

  # ───────────────────────────── reporting ───────────────────────────────
  report:
    name: Report
    needs: [changes, hygiene, static, complexity, security, test, data, frontend, container]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aggregate gate table
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/summary.py | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ci-report
          path: report.md
      - name: Fail if any gate failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/summary.py --check
