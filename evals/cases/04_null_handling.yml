id: null_handling
title: Customer LTV with zero for customers without orders
project: projects/jaffle_shop # repo-relative or absolute path of the dbt repo this case runs against
tags: [tricky, nulls]
request: Build dim_customer_ltv with lifetime value per customer; customers with no orders should show 0 lifetime value, not null.
target_model: dim_customer_ltv
code:
  required_columns: [customer_id, lifetime_value]
  grain: [customer_id]
data:
  - name: no null lifetime_value
    query: "select count(*) as v from {{ ref('{model}') }} where lifetime_value is null"
    expect: 0
  - name: every customer present
    query: "select count(*) as v from {{ ref('{model}') }}"
    expect_query: "select count(*) as v from {{ ref('stg_customers') }}"
golden:
  reference_sql: "select c.customer_id, coalesce(sum(o.amount), 0) as lifetime_value from {{ ref('stg_customers') }} c left join {{ ref('orders') }} o on c.customer_id = o.customer_id group by 1"
  key: [customer_id]
  columns: [customer_id, lifetime_value]
  tolerance: 0.001
